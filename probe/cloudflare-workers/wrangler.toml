name = "rent-radar-phase1-probe"
main = "src/worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Cron is intentionally absent. Add only for a bounded hosted test, then remove:
# [triggers]
# crons = ["*/10 * * * *"]

[vars]
LOG_LEVEL = "info"
SOURCE_TIMEOUT_MS = "15000"
SOURCE_MAX_RETRIES = "0"

# Set as a secret, never commit:
# wrangler secret put PROBE_TOKEN --config probe/cloudflare-workers/wrangler.toml
